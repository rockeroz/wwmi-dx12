name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      rt:
        description: 'RT module: 0 = public build (no RT module), observe = RT observe module M1'
        type: choice
        options: ['0', 'observe']
        default: '0'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Fetch Dear ImGui, the one ReShade SDK dependency the build uses
        run: git -C reshade_addon/sdk submodule update --init deps/imgui

      - name: Fetch the XXMI tags the engine version is read from
        shell: pwsh
        run: |
          if ((git -C third_party/3Dmigoto rev-parse --is-shallow-repository) -eq 'true') {
            git -C third_party/3Dmigoto fetch --tags --unshallow
          } else {
            git -C third_party/3Dmigoto fetch --tags
          }

      - name: Build and package
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\amd64\MSBuild.exe' | Select-Object -First 1
          & $msbuild package.proj -m -nologo "/p:WwmiPackageRT=${{ inputs.rt || '0' }}"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: wwmi-dx12
          path: build_addon/release/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: wwmi-dx12-map
          path: build_addon/wwmi_dx12.map

      - name: Attach the zip to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $map = "build_addon/release/wwmi_dx12-$($env:GITHUB_REF_NAME.TrimStart('v')).map"
          Copy-Item build_addon/wwmi_dx12.map $map
          gh release create $env:GITHUB_REF_NAME (Get-Item build_addon/release/*.zip).FullName $map --title $env:GITHUB_REF_NAME --generate-notes
