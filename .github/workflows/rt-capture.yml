name: RT capture tool

on:
  workflow_dispatch:
  push:
    paths: ['tools/rt_capture/**', 'tests/*rt_*', 'tests/mock_d3d12/**', 'reshade_addon/rt/**', 'reshade_addon/textures/tex_defer.*', 'reshade_addon/mods/claim_state.h', 'reshade_addon/migoto/port_vars.cpp', 'reshade_addon/draw/**', '.github/workflows/rt-capture.yml', 'tools/ci/**']
  pull_request:
    paths: ['tools/rt_capture/**', 'tests/*rt_*', 'tests/mock_d3d12/**', 'reshade_addon/rt/**', 'reshade_addon/textures/tex_defer.*', 'reshade_addon/mods/claim_state.h', 'reshade_addon/migoto/port_vars.cpp', 'reshade_addon/draw/**', '.github/workflows/rt-capture.yml', 'tools/ci/**']

permissions:
  contents: read

jobs:
  capture:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - name: Fetch the pinned ReShade SDK headers
        run: git submodule update --init reshade_addon/sdk
      - name: Build capture add-on
        shell: pwsh
        run: ./tools/ci/annotate.ps1 -Title "build.cmd" -Command "tools\rt_capture\build.cmd"
      - name: CPU test rt_capture_test
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build_addon\rt_capture | Out-Null
          ./tools/ci/annotate.ps1 -VcVars -Title "rt_capture_test" -Command "cl /nologo /std:c++20 /EHsc /W4 /WX /MT tests\rt_capture_test.cpp /Febuild_addon\rt_capture\rt_capture_test.exe /Fobuild_addon\rt_capture\rt_capture_test.obj && build_addon\rt_capture\rt_capture_test.exe"
      - name: CPU test rt_upload_readback_test
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build_addon\rt_capture | Out-Null
          ./tools/ci/annotate.ps1 -VcVars -Title "rt_upload_readback_test" -Command "cl /nologo /std:c++20 /EHsc /W4 /WX /MT /Itests\mock_d3d12 tests\rt_upload_readback_test.cpp /Febuild_addon\rt_capture\rt_upload_readback_test.exe /Fobuild_addon\rt_capture\rt_upload_readback_test.obj && build_addon\rt_capture\rt_upload_readback_test.exe"
      - name: CPU test rt_registry_test
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build_addon\rt_capture | Out-Null
          ./tools/ci/annotate.ps1 -VcVars -Title "rt_registry_test" -Command "cl /nologo /std:c++20 /EHsc /W4 /WX /MT tests\rt_registry_test.cpp /Febuild_addon\rt_capture\rt_registry_test.exe /Fobuild_addon\rt_capture\rt_registry_test.obj && build_addon\rt_capture\rt_registry_test.exe"
      - name: CPU M5 reservation and publication policies
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build_addon\rt_capture | Out-Null
          ./tools/ci/annotate.ps1 -VcVars -Title "rt_m5_policy_test" -Command "cl /nologo /std:c++20 /EHsc /W4 /WX /MT tests\rt_m5_policy_test.cpp /Febuild_addon\rt_capture\rt_m5_policy_test.exe /Fobuild_addon\rt_capture\rt_m5_policy_test.obj && build_addon\rt_capture\rt_m5_policy_test.exe"
      - name: CPU M5 native ABI and submission ordering
        if: always()
        shell: pwsh
        run: |
          ./tools/ci/annotate.ps1 -VcVars -Title "rt_m5_native_test" -Command "cl /nologo /std:c++20 /EHsc /W4 /WX /MT tests\rt_m5_native_test.cpp reshade_addon\rt\rt_m5_critical.cpp /Febuild_addon\rt_capture\rt_m5_native_test.exe /Fobuild_addon\rt_capture\ && build_addon\rt_capture\rt_m5_native_test.exe"
      - name: Test offline analysis
        run: python -m unittest discover -s tests -p "test_rt_*py"
      - name: CPU texture warmup and reload ordering
        if: always()
        timeout-minutes: 2
        shell: pwsh
        run: |
          git submodule update --init --depth 1 reshade_addon/sdk
          New-Item -ItemType Directory -Force build_addon\rt_capture | Out-Null
          ./tools/ci/annotate.ps1 -VcVars -Title "rt_tex_defer_test" -Command "cl /nologo /std:c++20 /EHsc /W4 /WX /MT /external:W0 /external:I reshade_addon\sdk\include tests\rt_tex_defer_test.cpp reshade_addon\textures\tex_defer.cpp /Febuild_addon\rt_capture\rt_tex_defer_test.exe /Fobuild_addon\rt_capture\ && build_addon\rt_capture\rt_tex_defer_test.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: wwmi-rt-capture-development
          path: |
            build_addon/rt_capture/wwmi_rt_capture.addon64
            tools/rt_capture/README.md
            tools/rt_capture/*.py
            tools/rt_capture/targets/*.target
